[package]
name = "planspec-core"
version = "0.1.0"
edition = "2021"
description = "Core types and validation for PlanSpec declarative work orchestration"
license = "Apache-2.0"
repository = "https://github.com/anthropics/planspec"
keywords = ["planspec", "orchestration", "workflow", "dag"]
categories = ["data-structures", "config"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
jsonschema = "0.18"
thiserror = "1.0"

[dev-dependencies]
serde_yaml = "0.9"
