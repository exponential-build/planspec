[workspace]
resolver = "2"
members = [
    "core",
    "cli",
    "server",
]

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Exponential Build, Inc."]

[workspace.dependencies]
# Shared dependencies across crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
lto = true
codegen-units = 1
