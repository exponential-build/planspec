name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build all crates
        run: cargo build --workspace --release

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: planspec-cli
          path: target/release/planspec

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: planspec-server
          path: target/release/planspec-server

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: planspec-cli
          path: target/release/

      - name: Download server binary
        uses: actions/download-artifact@v4
        with:
          name: planspec-server
          path: target/release/

      - name: Make binaries executable
        run: |
          chmod +x target/release/planspec
          chmod +x target/release/planspec-server

      - name: Start server
        run: |
          target/release/planspec-server &
          sleep 3
          curl -s http://localhost:8080/healthz || exit 1

      - name: Run integration tests
        run: cargo test -p planspec --test integration_test -- --test-threads=1

      - name: Stop server
        if: always()
        run: pkill planspec-server || true

  validate-fixtures:
    name: Validate Fixtures
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download CLI binary
        uses: actions/download-artifact@v4
        with:
          name: planspec-cli
          path: target/release/

      - name: Make CLI executable
        run: chmod +x target/release/planspec

      - name: Validate fixture bundle
        run: target/release/planspec validate -f docs/planspec/fixtures/v0.1.0/bundle.yaml

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ajv-cli
        run: npm install -g ajv-cli ajv-formats

      - name: Validate JSON schemas are valid
        run: |
          for schema in schemas/v1alpha1/*.schema.json; do
            echo "Validating $schema..."
            ajv compile -s "$schema" --spec=draft2020 -r "schemas/common/*.schema.json" || exit 1
          done
