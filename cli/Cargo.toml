[package]
name = "planspec"
version = "0.1.0"
edition = "2021"
description = "CLI for PlanSpec - declarative work orchestration"
license = "MIT"
repository = "https://github.com/exponential-build/planspec"
authors = ["Exponential Build, Inc."]
keywords = ["planspec", "orchestration", "workflow", "kubernetes"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# Core types
planspec-core = { path = "../core" }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Output formatting
tabled = "0.15"
colored = "2"

# Error handling
thiserror = "1"
anyhow = "1"

# Utilities
url = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

# Async streams for watch
futures = "0.3"
tokio-stream = "0.1"

# Temp files for edit command
tempfile = "3"

# Diff for edit command
similar = "2"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
reqwest = { version = "0.12", features = ["blocking", "json"] }

[[bin]]
name = "planspec"
path = "src/main.rs"
