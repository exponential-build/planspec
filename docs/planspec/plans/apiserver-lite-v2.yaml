apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: apiserver-lite-v2
  namespace: planspec
  labels:
    planspec.io/goal: implement-apiserver-lite
    planspec.io/series: apiserver-lite
    planspec.io/version: "2"
spec:
  goalRef:
    name: implement-apiserver-lite
  series: apiserver-lite
  version: "2"
  supersedes:
    - name: apiserver-lite-v1
  description: "Implementation plan for minimal PlanSpec API server (v2: cleaner dependency model)"
  graph:
    nodes:
      - id: project-setup
        kind: Task
        description: "Create server/ directory with Cargo.toml, dependencies (axum, sqlx, tokio, serde, jsonschema)"
        capabilityRef:
          name: code-generation
        outputs:
          - server/Cargo.toml
          - server/src/main.rs

      - id: data-model
        kind: Task
        description: "Define storage types: StoredObject with namespace, kind, name, object JSON, uid, resourceVersion, generation, timestamps"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/storage/mod.rs
          - server/src/storage/types.rs

      - id: storage-layer
        kind: Task
        description: "Implement SQLite storage: init schema, CRUD operations, resourceVersion checks, generation increment logic (spec changes only)"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/storage/sqlite.rs

      - id: validation
        kind: Task
        description: "Integrate JSON schema validation (embed schemas via include_str! or inline constants) and DAG cycle detection for Plans"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/validate.rs

      - id: routes-crud
        kind: Task
        description: "Implement REST routes: list, get, create, replace, delete, status subresource for all resource types"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/routes/mod.rs
          - server/src/routes/resources.rs

      - id: routes-apply
        kind: Task
        description: "Implement POST /namespaces/{ns}/apply for atomic multi-resource apply with validation"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/routes/apply.rs

      - id: routes-validate
        kind: Task
        description: "Implement POST /validate for dry-run validation without persistence"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/routes/validate.rs

      - id: watch
        kind: Task
        description: "Implement watch endpoint with broadcast channel and SSE streaming"
        capabilityRef:
          name: code-generation
        outputs:
          - server/src/watch.rs

      - id: wire-up
        kind: Task
        description: "Wire all routes into Axum router, add server startup with configurable port (default 8080)"
        capabilityRef:
          name: code-generation
        inputs:
          port: 8080
        outputs:
          - server/src/main.rs

      - id: integration-test
        kind: Task
        description: "Test end-to-end: start server, use CLI to apply/get/watch resources, verify all acceptance criteria endpoints"
        capabilityRef:
          name: code-execution

      - id: review
        kind: Gate
        description: "Human review: does it meet acceptance criteria?"
        when: "manualApproval"

    edges:
      - from: project-setup
        to: data-model
      - from: project-setup
        to: validation
      - from: data-model
        to: storage-layer
      - from: storage-layer
        to: routes-crud
      - from: validation
        to: routes-crud
      - from: routes-crud
        to: routes-apply
      - from: routes-crud
        to: routes-validate
      - from: storage-layer
        to: watch
      - from: routes-crud
        to: wire-up
      - from: routes-apply
        to: wire-up
      - from: routes-validate
        to: wire-up
      - from: watch
        to: wire-up
      - from: wire-up
        to: integration-test
      - from: integration-test
        to: review
