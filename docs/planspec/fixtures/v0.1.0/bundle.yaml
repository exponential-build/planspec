# Analysis Capabilities
#
# Capabilities for research and security scanning.
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: research
  namespace: planspec
  labels:
    category: analysis
spec:
  displayName: "Research"
  description: "Research topics, gather information, and synthesize findings"
  category: analysis
  inputs:
    - name: topic
      type: string
      description: "The topic to research"
      required: true
    - name: depth
      type: string
      description: "Research depth: shallow, moderate, deep"
      default: "moderate"
    - name: sources
      type: array
      description: "Preferred sources to consult"
  outputs:
    - name: findings
      type: object
      description: "Structured research findings"
    - name: sources
      type: array
      description: "List of sources consulted"
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: security-scan
  namespace: planspec
  labels:
    category: analysis
spec:
  displayName: "Security Scan"
  description: "Scan code for security vulnerabilities"
  category: security
  inputs:
    - name: scanType
      type: string
      description: "Type of scan: sast, dast, dependency"
      required: true
    - name: paths
      type: array
      description: "Paths to scan"
    - name: severity
      type: string
      description: "Minimum severity to report"
      default: "medium"
    - name: focus
      type: array
      description: "Specific security concerns to focus on"
  outputs:
    - name: vulnerabilities
      type: array
      description: "List of vulnerabilities found"
    - name: riskScore
      type: number
      description: "Overall risk score"
    - name: recommendations
      type: array
      description: "Remediation recommendations"
# Development Capabilities
#
# Capabilities related to code development: analysis, generation, review, refactoring.
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: code-analysis
  namespace: planspec
  labels:
    category: development
spec:
  displayName: "Code Analysis"
  description: "Analyze code structure, patterns, and dependencies"
  category: development
  inputs:
    - name: paths
      type: array
      description: "File or directory paths to analyze"
      required: true
    - name: language
      type: string
      description: "Programming language (auto-detected if not specified)"
    - name: focus
      type: array
      description: "Specific aspects to focus on (e.g., security, performance)"
  outputs:
    - name: analysis
      type: object
      description: "Structured analysis results"
    - name: recommendations
      type: array
      description: "Actionable recommendations"
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: code-generation
  namespace: planspec
  labels:
    category: development
spec:
  displayName: "Code Generation"
  description: "Generate code from specifications and requirements"
  category: development
  inputs:
    - name: specification
      type: string
      description: "What to generate"
      required: true
    - name: language
      type: string
      description: "Target programming language"
      required: true
    - name: framework
      type: string
      description: "Framework to use (e.g., react, express)"
    - name: targetFiles
      type: array
      description: "Files to create or modify"
    - name: style
      type: object
      description: "Code style preferences"
  outputs:
    - name: files
      type: array
      description: "Generated or modified files"
    - name: changes
      type: object
      description: "Summary of changes made"
  requirements:
    - capability: code-analysis
      optional: true
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: code-review
  namespace: planspec
  labels:
    category: development
spec:
  displayName: "Code Review"
  description: "Review code changes and provide feedback"
  category: development
  inputs:
    - name: changes
      type: object
      description: "Code changes to review (diff or file list)"
      required: true
    - name: focus
      type: array
      description: "Aspects to focus on (correctness, style, security, performance)"
      default: ["correctness", "security"]
    - name: context
      type: string
      description: "Additional context about the changes"
  outputs:
    - name: comments
      type: array
      description: "Review comments"
    - name: approval
      type: boolean
      description: "Whether the changes are approved"
    - name: suggestions
      type: array
      description: "Improvement suggestions"
  requirements:
    - capability: code-analysis
      optional: true
    - capability: security-scan
      optional: true
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: refactoring
  namespace: planspec
  labels:
    category: development
spec:
  displayName: "Refactoring"
  description: "Refactor code to improve structure without changing behavior"
  category: development
  inputs:
    - name: targetCode
      type: array
      description: "Files or modules to refactor"
      required: true
    - name: goals
      type: array
      description: "Refactoring goals (e.g., extract-function, simplify-logic)"
    - name: constraints
      type: object
      description: "Constraints to respect (API stability, performance)"
  outputs:
    - name: changes
      type: array
      description: "Refactored code changes"
    - name: explanation
      type: string
      description: "Explanation of changes made"
  requirements:
    - capability: code-analysis
    - capability: test-execution
      optional: true
# Documentation Capability
#
# Capability for generating and updating documentation.
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: documentation
  namespace: planspec
  labels:
    category: documentation
spec:
  displayName: "Documentation"
  description: "Generate or update documentation"
  category: documentation
  inputs:
    - name: type
      type: string
      description: "Type of documentation: api, user-guide, readme, changelog"
      required: true
    - name: sourcePath
      type: string
      description: "Source code or content path"
    - name: format
      type: string
      description: "Output format: markdown, html, pdf"
      default: "markdown"
    - name: audience
      type: string
      description: "Target audience: developer, user, operator"
      default: "developer"
  outputs:
    - name: documents
      type: array
      description: "Generated documentation files"
# Planning Capabilities
#
# Capabilities for planning and architecture design.
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: planning
  namespace: planspec
  labels:
    category: planning
spec:
  displayName: "Planning"
  description: "Create implementation plans from goals"
  category: planning
  inputs:
    - name: goalRef
      type: object
      description: "Reference to the goal to plan for"
      required: true
    - name: constraints
      type: object
      description: "Constraints to consider (time, resources, technology)"
    - name: context
      type: array
      description: "Contextual information for planning"
  outputs:
    - name: plan
      type: object
      description: "Generated Plan resource"
  requirements:
    - capability: research
      optional: true
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: architecture
  namespace: planspec
  labels:
    category: planning
spec:
  displayName: "Architecture"
  description: "Design system architecture and make technical decisions"
  category: planning
  inputs:
    - name: requirements
      type: array
      description: "Functional and non-functional requirements"
      required: true
    - name: constraints
      type: object
      description: "Architectural constraints (scale, latency, cost)"
    - name: context
      type: array
      description: "Existing system context and integrations"
  outputs:
    - name: design
      type: object
      description: "Architectural design document"
    - name: decisions
      type: array
      description: "Key architectural decisions and rationale"
    - name: tradeoffs
      type: array
      description: "Documented tradeoffs and alternatives considered"
  requirements:
    - capability: research
      optional: true
# Testing and Execution Capabilities
#
# Capabilities related to testing and code execution.
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: test-generation
  namespace: planspec
  labels:
    category: testing
spec:
  displayName: "Test Generation"
  description: "Generate tests for existing code"
  category: testing
  inputs:
    - name: targetCode
      type: array
      description: "Files or functions to test"
      required: true
    - name: testFramework
      type: string
      description: "Test framework to use"
      default: "jest"
    - name: coverage
      type: string
      description: "Target coverage percentage"
      default: "80%"
    - name: testTypes
      type: array
      description: "Types of tests to generate (unit, integration, e2e)"
      default: ["unit"]
  outputs:
    - name: testFiles
      type: array
      description: "Generated test files"
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: test-execution
  namespace: planspec
  labels:
    category: testing
spec:
  displayName: "Test Execution"
  description: "Execute test suites and report results"
  category: testing
  inputs:
    - name: testCommand
      type: string
      description: "Command to run tests"
      default: "npm test"
    - name: coverage
      type: boolean
      description: "Generate coverage report"
      default: true
    - name: failFast
      type: boolean
      description: "Stop on first failure"
      default: false
  outputs:
    - name: results
      type: object
      description: "Test execution results"
    - name: coverage
      type: object
      description: "Coverage report"
---
apiVersion: planspec.io/v1alpha1
kind: Capability
metadata:
  name: code-execution
  namespace: planspec
  labels:
    category: execution
spec:
  displayName: "Code Execution"
  description: "Execute code, scripts, or shell commands"
  category: execution
  inputs:
    - name: command
      type: string
      description: "Command or script to execute"
      required: true
    - name: workingDirectory
      type: string
      description: "Working directory for execution"
    - name: environment
      type: object
      description: "Environment variables"
  outputs:
    - name: exitCode
      type: integer
      description: "Exit code of the command"
    - name: stdout
      type: string
      description: "Standard output"
    - name: stderr
      type: string
      description: "Standard error"
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: add-context-fields
  namespace: planspec
spec:
  description: "Add context attachment fields to PlanSpec resources for embedding markdown snippets, code pointers, and structured notes"
  constraints:
    scope: minimal
    philosophy: "attachments not knowledge-graph"
  acceptanceCriteria:
    - description: "spec.context[] available on Goal, Plan, and Execution resources"
    - description: "Plan.spec.graph.nodes[].context[] available for per-node context"
    - description: "ContextItem supports formats: markdown, text, json, uri-list"
    - description: "Schema validates context structure and format enum"
    - description: "Server accepts and stores context without modification"
    - description: "CLI displays context in describe output"
    - description: "Documentation explains context vs knowledge-graph split"
  timeout: "3d"
  priority: 80
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: cli-improvements
  namespace: planspec
spec:
  description: "Improve CLI to better display plan versioning, status, and filtering"
  constraints:
    language: rust
    cli: planspec
  acceptanceCriteria:
    - description: "describe plan shows supersedes and series/version prominently"
    - description: "get plans --series filters by series"
    - description: "get plans sorts by (series, version desc) by default"
    - description: "Plan.status.phase and nodeCount populated on create/replace"
    - description: "List views show PHASE and NODES columns populated"
  context:
    - name: motivation
      format: markdown
      content: |
        Currently `planspec get plans` shows empty PHASE and NODES columns.
        The server should populate these on create/replace, and the CLI
        should support filtering by series to make versioning visible.
  timeout: "2d"
  priority: 80
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: implement-apiserver-lite
  namespace: planspec
spec:
  description: "Implement a minimal local PlanSpec API server as a reference implementation"
  constraints:
    language: rust
    framework: axum
    storage: sqlite
  acceptanceCriteria:
    - description: "Server stores resources by {namespace, kind, name}"
    - description: "resourceVersion enforces optimistic concurrency on PUT"
    - description: "generation increments only on spec changes (not on status updates)"
    - description: "Schema validation rejects invalid resources"
    - description: "Plan DAG acyclicity is enforced on create/replace"
    - description: "Watch endpoint streams NDJSON events"
    - description: "CLI can apply, get, and watch resources against server"
    - description: "POST /apis/planspec.io/v1alpha1/namespaces/{ns}/apply returns created/updated resources"
    - description: "GET /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/{name} returns single resource"
    - description: "PUT /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/{name} requires resourceVersion"
    - description: "PUT /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/{name}/status updates only status"
    - description: "GET /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/watch streams events"
  timeout: "7d"
  priority: 100
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-core-crate
  namespace: planspec
spec:
  description: "Create a shared planspec-core crate with types consumable by CLI, server, and external implementations"
  constraints:
    language: rust
    design: library-first
  acceptanceCriteria:
    - description: "planspec-core crate exists with all resource types"
    - description: "Types derive Serialize, Deserialize, Clone, Debug, PartialEq"
    - description: "CLI and server both depend on planspec-core"
    - description: "JSON schema validation lives in planspec-core"
    - description: "Types are documented with rustdoc"
    - description: "External crates can depend on planspec-core for type definitions"
  context:
    - name: motivation
      format: markdown
      content: |
        Currently types are defined separately in CLI and server with embedded
        JSON schemas duplicated in both. A shared core crate provides:
        - Single source of truth for resource types
        - Consistent serialization/deserialization
        - Reusable validation logic
        - Foundation for other Rust-based implementations
        - Better developer experience for ecosystem builders
  timeout: "3d"
  priority: 90
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-fixtures-and-integration-tests
  namespace: planspec
spec:
  description: "Create fixtures and integration test infrastructure for PlanSpec"
  acceptanceCriteria:
    - description: "fixtures/ directory exists with versioned bundles"
    - description: "Integration tests verify apply/get/watch workflows"
    - description: "CI runs integration tests against real server"
  context:
    - name: fixture-structure
      format: markdown
      content: |
        Fixtures provide versioned snapshots of PlanSpec resources for testing:

        ```
        fixtures/
        ├── v0.1.0/
        │   ├── bundle.yaml           # All resources concatenated
        │   ├── goals.yaml
        │   ├── capabilities.yaml
        │   ├── plans.yaml
        │   └── bindings.yaml
        └── README.md
        ```

        Integration tests should:
        1. Start a fresh server
        2. Apply fixtures
        3. Verify resources via get/describe
        4. Test watch for live updates
  priority: 875
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-goal-to-plan-resolution-mvp
  namespace: planspec
spec:
  description: "Implement minimal goal-to-plan resolution for PlanSpec"
  acceptanceCriteria:
    - description: "Goal.status.activePlanRef is set when plan selected"
    - description: "planSelector matching works"
    - description: "Plan versioning (series/version/supersedes) respected"
  context:
    - name: resolution-logic
      format: markdown
      content: |
        Plan resolution determines which Plan satisfies a Goal:

        1. Find Plans where `spec.goalRef.name` matches the Goal
        2. Filter by `planSelector` labels if specified on Goal
        3. Group by `spec.series`
        4. Within each series, select highest `spec.version`
        5. Exclude Plans that are superseded by others
        6. Set `Goal.status.activePlanRef` to selected Plan

        MVP focuses on basic matching; advanced selectors come later.
  priority: 850
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-schema-and-conventions-v0
  namespace: planspec
spec:
  description: "Establish schema conventions and validation for PlanSpec resources"
  acceptanceCriteria:
    - description: "JSON schemas are complete for all resource types"
    - description: "Naming conventions documented and enforced"
    - description: "Label and annotation conventions established"
  context:
    - name: conventions
      format: markdown
      content: |
        Key conventions to establish:
        - Resource naming: lowercase, hyphenated (e.g., `my-goal-name`)
        - Labels: `planspec.io/` prefix for system labels
        - Annotations: `planspec.io/` prefix for system annotations
        - Series/version: Plans use `spec.series` and `spec.version` for versioning
        - Goal references: Plans link to Goals via `spec.goalRef.name`
  priority: 900
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-status-and-observability-v0
  namespace: planspec
spec:
  description: "Implement status updates and observability for PlanSpec resources"
  acceptanceCriteria:
    - description: "Resources have proper status conditions"
    - description: "observedGeneration is tracked"
    - description: "Phase transitions visible via watch"
  context:
    - name: status-design
      format: markdown
      content: |
        Status fields follow Kubernetes conventions:

        ```yaml
        status:
          phase: Ready | InProgress | Failed | Completed
          conditions:
            - type: Valid
              status: "True"
              reason: SchemaValid
              lastTransitionTime: "2024-01-15T10:00:00Z"
              observedGeneration: 1
          observedGeneration: 1
        ```

        Key behaviors:
        - `observedGeneration` tracks which `metadata.generation` was processed
        - Conditions use True/False/Unknown status values
        - Phase provides high-level summary
        - Watch streams status changes in real-time
  priority: 825
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-v0-ready-for-exponential
  namespace: planspec
spec:
  description: "Meta-goal that tracks overall v0 readiness for PlanSpec to be used as the work orchestration system for Exponential"
  acceptanceCriteria:
    - description: "All subgoals completed"
    - description: "PlanSpec is used for all significant development work"
    - description: "Documentation is complete and accurate"
  context:
    - name: overview
      format: markdown
      content: |
        This is the top-level meta-goal for PlanSpec v0. It represents the milestone
        where PlanSpec is ready to be used as the canonical work orchestration system
        for Exponential development.

        Subgoals (in dependency order):
        1. planspec-schema-and-conventions-v0 - Establish schema conventions
        2. planspec-fixtures-and-integration-tests - Test infrastructure
        3. planspec-goal-to-plan-resolution-mvp - Plan selection logic
        4. planspec-status-and-observability-v0 - Status updates and visibility
  priority: 1000
# PlanSpec Plans - v0.1.0 Fixture
#
# All plan definitions for the PlanSpec project.
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: add-context-fields-v1
  namespace: planspec
  labels:
    planspec.io/goal: add-context-fields
    planspec.io/series: add-context-fields
    planspec.io/version: "1"
spec:
  goalRef:
    name: add-context-fields
  series: add-context-fields
  version: "1"
  description: "Implementation plan for context attachment fields"
  graph:
    nodes:
      - id: design-schema
        kind: Task
        description: "Design ContextItem schema in schemas/common/context.schema.json"
        capabilityRef:
          name: code-generation
        context:
          - format: markdown
            content: |
              ### ContextItem Schema Design

              ```json
              {
                "type": "object",
                "properties": {
                  "name": { "type": "string", "description": "Optional identifier" },
                  "format": { "enum": ["markdown", "text", "json", "uri-list"] },
                  "content": { "description": "String for markdown/text, object for json" },
                  "uris": { "type": "array", "items": { "type": "string", "format": "uri" } }
                },
                "required": ["format"],
                "oneOf": [
                  { "required": ["content"] },
                  { "required": ["uris"] }
                ]
              }
              ```

              - `format` is required, determines interpretation
              - Either `content` or `uris` must be present (not both)
              - `name` is optional, for referencing specific context items
        outputs:
          - schemas/common/context.schema.json

      - id: update-resource-schemas
        kind: Task
        description: "Add spec.context[] to Goal, Plan, Execution schemas; add context[] to Plan node schema"
        capabilityRef:
          name: code-generation
        context:
          - format: markdown
            content: |
              Add to each resource schema:
              ```json
              "context": {
                "type": "array",
                "items": { "$ref": "../common/context.schema.json" },
                "description": "Contextual attachments (notes, pointers, structured data)"
              }
              ```

              For Plan nodes, add same field to node schema.
        outputs:
          - schemas/v1alpha1/goal.schema.json
          - schemas/v1alpha1/plan.schema.json
          - schemas/v1alpha1/execution.schema.json

      - id: update-spec-docs
        kind: Task
        description: "Update SPECIFICATION.md with Context section explaining field, formats, and KG split"
        capabilityRef:
          name: code-generation
        context:
          - format: markdown
            content: |
              Add new section "## Context Attachments" covering:
              - Purpose: execution-local notes that travel with the plan
              - ContextItem schema and format enum
              - Use cases for each format
              - What belongs in context vs knowledge graph
              - Security: not for secrets, use URIs to reference secrets
              - Size limits are implementation-defined
        outputs:
          - SPECIFICATION.md

      - id: update-server-validation
        kind: Task
        description: "Update server's embedded schemas to include context field validation"
        capabilityRef:
          name: code-generation
        context:
          - format: markdown
            content: |
              The server uses embedded schemas in `server/src/validate.rs`.
              Add `context` field to each resource schema's `spec` properties.
              Keep validation minimal - just structure, not content scanning.
        outputs:
          - server/src/validate.rs

      - id: update-cli-describe
        kind: Task
        description: "Update CLI describe command to display context attachments"
        capabilityRef:
          name: code-generation
        context:
          - format: markdown
            content: |
              In describe output, show context items:
              ```
              Context:
                [markdown] design-notes
                  ### Notes
                  - Use existing hook...

                [uri-list] code-pointers
                  - repo://src/auth/session.ts
              ```

              Truncate long content with "..." and show byte count.
        outputs:
          - cli/src/commands/describe.rs

      - id: update-cli-validation
        kind: Task
        description: "Update CLI's embedded schemas to match server"
        capabilityRef:
          name: code-generation
        outputs:
          - cli/src/schema/mod.rs

      - id: create-example
        kind: Task
        description: "Create example YAML showing context usage across Goal, Plan nodes, and Execution"
        capabilityRef:
          name: code-generation
        context:
          - format: markdown
            content: |
              Create `docs/examples/context-example.yaml` demonstrating:
              - Goal with markdown design notes
              - Plan with uri-list pointing to relevant files
              - Node-level context with implementation hints
              - Execution with runtime notes
        outputs:
          - docs/examples/context-example.yaml

      - id: integration-test
        kind: Task
        description: "Test end-to-end: validate, apply, get, describe resources with context"
        capabilityRef:
          name: code-execution

      - id: review
        kind: Gate
        description: "Human review: context fields working as expected?"
        when: "manualApproval"

    edges:
      - from: design-schema
        to: update-resource-schemas
      - from: design-schema
        to: update-spec-docs
      - from: update-resource-schemas
        to: update-server-validation
      - from: update-resource-schemas
        to: update-cli-validation
      - from: update-server-validation
        to: update-cli-describe
      - from: update-cli-validation
        to: update-cli-describe
      - from: update-spec-docs
        to: create-example
      - from: update-cli-describe
        to: create-example
      - from: create-example
        to: integration-test
      - from: integration-test
        to: review
---
apiVersion: planspec.io/v1alpha1
kind: Plan
metadata:
  name: apiserver-lite-v1
  namespace: planspec
  labels:
    planspec.io/goal: implement-apiserver-lite
    planspec.io/series: apiserver-lite
    planspec.io/version: "1"
spec:
  goalRef:
    name: implement-apiserver-lite
  series: apiserver-lite
  version: "1"
  description: "Implementation plan for minimal PlanSpec API server"
  graph:
    nodes:
      - id: project-setup
        kind: Task
        description: "Create server/ directory with Cargo.toml, dependencies (axum, sqlx, tokio, serde)"
        capabilityRef:
          name: code-generation
        outputs:
          - server/Cargo.toml
          - server/src/main.rs

      - id: data-model
        kind: Task
        description: "Define storage types: StoredObject with key, object_json, uid, resourceVersion, generation, timestamps"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on: project-setup
        outputs:
          - server/src/storage/mod.rs
          - server/src/storage/types.rs

      - id: storage-layer
        kind: Task
        description: "Implement SQLite storage: init schema, CRUD operations, resourceVersion checks, generation increment logic"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on: data-model
        outputs:
          - server/src/storage/sqlite.rs

      - id: validation
        kind: Task
        description: "Integrate JSON schema validation and DAG cycle detection for Plans"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on: project-setup
        outputs:
          - server/src/validate.rs

      - id: routes-crud
        kind: Task
        description: "Implement REST routes: list, get, create, replace, delete for all resource types"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on:
            - storage-layer
            - validation
        outputs:
          - server/src/routes/mod.rs
          - server/src/routes/resources.rs

      - id: routes-apply
        kind: Task
        description: "Implement POST /namespaces/{ns}/apply for atomic multi-resource apply"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on: routes-crud
        outputs:
          - server/src/routes/apply.rs

      - id: routes-validate
        kind: Task
        description: "Implement POST /validate for dry-run validation without persistence"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on: routes-crud
        outputs:
          - server/src/routes/validate.rs

      - id: watch
        kind: Task
        description: "Implement watch endpoint with broadcast channel and NDJSON streaming"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on: storage-layer
        outputs:
          - server/src/watch.rs

      - id: wire-up
        kind: Task
        description: "Wire all routes into Axum router, add server startup with configurable port"
        capabilityRef:
          name: code-generation
        inputs:
          depends_on:
            - routes-crud
            - routes-apply
            - routes-validate
            - watch
        outputs:
          - server/src/main.rs

      - id: integration-test
        kind: Task
        description: "Test end-to-end: start server, use CLI to apply/get/watch resources"
        capabilityRef:
          name: code-execution
        inputs:
          depends_on: wire-up

      - id: review
        kind: Gate
        description: "Human review: does it meet acceptance criteria?"
        inputs:
          depends_on: integration-test

    edges:
      - from: project-setup
        to: data-model
      - from: project-setup
        to: validation
      - from: data-model
        to: storage-layer
      - from: storage-layer
        to: routes-crud
      - from: validation
        to: routes-crud
      - from: routes-crud
        to: routes-apply
      - from: routes-crud
        to: routes-validate
      - from: storage-layer
        to: watch
      - from: routes-crud
        to: wire-up
      - from: routes-apply
        to: wire-up
      - from: routes-validate
        to: wire-up
      - from: watch
        to: wire-up
      - from: wire-up
        to: integration-test
      - from: integration-test
        to: review
