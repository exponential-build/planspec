# PlanSpec Goals - v0.1.0 Fixture
#
# All goals for the PlanSpec project.
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: add-context-fields
  namespace: planspec
spec:
  description: "Add context attachment fields to PlanSpec resources for embedding markdown snippets, code pointers, and structured notes"
  constraints:
    scope: minimal
    philosophy: "attachments not knowledge-graph"
  acceptanceCriteria:
    - description: "spec.context[] available on Goal, Plan, and Execution resources"
    - description: "Plan.spec.graph.nodes[].context[] available for per-node context"
    - description: "ContextItem supports formats: markdown, text, json, uri-list"
    - description: "Schema validates context structure and format enum"
    - description: "Server accepts and stores context without modification"
    - description: "CLI displays context in describe output"
    - description: "Documentation explains context vs knowledge-graph split"
  timeout: "3d"
  priority: 80
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: cli-improvements
  namespace: planspec
spec:
  description: "Improve CLI to better display plan versioning, status, and filtering"
  constraints:
    language: rust
    cli: planspec
  acceptanceCriteria:
    - description: "describe plan shows supersedes and series/version prominently"
    - description: "get plans --series filters by series"
    - description: "get plans sorts by (series, version desc) by default"
    - description: "Plan.status.phase and nodeCount populated on create/replace"
    - description: "List views show PHASE and NODES columns populated"
  context:
    - name: motivation
      format: markdown
      content: |
        Currently `planspec get plans` shows empty PHASE and NODES columns.
        The server should populate these on create/replace, and the CLI
        should support filtering by series to make versioning visible.
  timeout: "2d"
  priority: 80
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: implement-apiserver-lite
  namespace: planspec
spec:
  description: "Implement a minimal local PlanSpec API server as a reference implementation"
  constraints:
    language: rust
    framework: axum
    storage: sqlite
  acceptanceCriteria:
    - description: "Server stores resources by {namespace, kind, name}"
    - description: "resourceVersion enforces optimistic concurrency on PUT"
    - description: "generation increments only on spec changes (not on status updates)"
    - description: "Schema validation rejects invalid resources"
    - description: "Plan DAG acyclicity is enforced on create/replace"
    - description: "Watch endpoint streams SSE events"
    - description: "CLI can apply, get, and watch resources against server"
    - description: "POST /apis/planspec.io/v1alpha1/namespaces/{ns}/apply returns created/updated resources"
    - description: "GET /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/{name} returns single resource"
    - description: "PUT /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/{name} requires resourceVersion"
    - description: "PUT /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/{name}/status updates only status"
    - description: "GET /apis/planspec.io/v1alpha1/namespaces/{ns}/{resource}/watch streams events"
  timeout: "7d"
  priority: 100
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-core-crate
  namespace: planspec
spec:
  description: "Create a shared planspec-core crate with types consumable by CLI, server, and external implementations"
  constraints:
    language: rust
    design: library-first
  acceptanceCriteria:
    - description: "planspec-core crate exists with all resource types"
    - description: "Types derive Serialize, Deserialize, Clone, Debug, PartialEq"
    - description: "CLI and server both depend on planspec-core"
    - description: "JSON schema validation lives in planspec-core"
    - description: "Types are documented with rustdoc"
    - description: "External crates can depend on planspec-core for type definitions"
  context:
    - name: motivation
      format: markdown
      content: |
        Currently types are defined separately in CLI and server with embedded
        JSON schemas duplicated in both. A shared core crate provides:
        - Single source of truth for resource types
        - Consistent serialization/deserialization
        - Reusable validation logic
        - Foundation for other Rust-based implementations
        - Better developer experience for ecosystem builders
  timeout: "3d"
  priority: 90
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-fixtures-and-integration-tests
  namespace: planspec
spec:
  description: "Create fixtures and integration test infrastructure for PlanSpec"
  acceptanceCriteria:
    - description: "fixtures/ directory exists with versioned bundles"
    - description: "Integration tests verify apply/get/watch workflows"
    - description: "CI runs integration tests against real server"
  context:
    - name: fixture-structure
      format: markdown
      content: |
        Fixtures provide versioned snapshots of PlanSpec resources for testing:

        ```
        fixtures/
        ├── v0.1.0/
        │   ├── bundle.yaml           # All resources concatenated
        │   ├── goals.yaml
        │   ├── capabilities.yaml
        │   ├── plans.yaml
        │   └── bindings.yaml
        └── README.md
        ```

        Integration tests should:
        1. Start a fresh server
        2. Apply fixtures
        3. Verify resources via get/describe
        4. Test watch for live updates
  priority: 875
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-goal-to-plan-resolution-mvp
  namespace: planspec
spec:
  description: "Implement minimal goal-to-plan resolution for PlanSpec"
  acceptanceCriteria:
    - description: "Goal.status.activePlanRef is set when plan selected"
    - description: "planSelector matching works"
    - description: "Plan versioning (series/version/supersedes) respected"
  context:
    - name: resolution-logic
      format: markdown
      content: |
        Plan resolution determines which Plan satisfies a Goal:

        1. Find Plans where `spec.goalRef.name` matches the Goal
        2. Filter by `planSelector` labels if specified on Goal
        3. Group by `spec.series`
        4. Within each series, select highest `spec.version`
        5. Exclude Plans that are superseded by others
        6. Set `Goal.status.activePlanRef` to selected Plan

        MVP focuses on basic matching; advanced selectors come later.
  priority: 850
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-schema-and-conventions-v0
  namespace: planspec
spec:
  description: "Establish schema conventions and validation for PlanSpec resources"
  acceptanceCriteria:
    - description: "JSON schemas are complete for all resource types"
    - description: "Naming conventions documented and enforced"
    - description: "Label and annotation conventions established"
  context:
    - name: conventions
      format: markdown
      content: |
        Key conventions to establish:
        - Resource naming: lowercase, hyphenated (e.g., `my-goal-name`)
        - Labels: `planspec.io/` prefix for system labels
        - Annotations: `planspec.io/` prefix for system annotations
        - Series/version: Plans use `spec.series` and `spec.version` for versioning
        - Goal references: Plans link to Goals via `spec.goalRef.name`
  priority: 900
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-status-and-observability-v0
  namespace: planspec
spec:
  description: "Implement status updates and observability for PlanSpec resources"
  acceptanceCriteria:
    - description: "Resources have proper status conditions"
    - description: "observedGeneration is tracked"
    - description: "Phase transitions visible via watch"
  context:
    - name: status-design
      format: markdown
      content: |
        Status fields follow Kubernetes conventions:

        ```yaml
        status:
          phase: Ready | InProgress | Failed | Completed
          conditions:
            - type: Valid
              status: "True"
              reason: SchemaValid
              lastTransitionTime: "2024-01-15T10:00:00Z"
              observedGeneration: 1
          observedGeneration: 1
        ```

        Key behaviors:
        - `observedGeneration` tracks which `metadata.generation` was processed
        - Conditions use True/False/Unknown status values
        - Phase provides high-level summary
        - Watch streams status changes in real-time
  priority: 825
---
apiVersion: planspec.io/v1alpha1
kind: Goal
metadata:
  name: planspec-v0-ready-for-exponential
  namespace: planspec
spec:
  description: "Meta-goal that tracks overall v0 readiness for PlanSpec to be used as the work orchestration system for Exponential"
  acceptanceCriteria:
    - description: "All subgoals completed"
    - description: "PlanSpec is used for all significant development work"
    - description: "Documentation is complete and accurate"
  context:
    - name: overview
      format: markdown
      content: |
        This is the top-level meta-goal for PlanSpec v0. It represents the milestone
        where PlanSpec is ready to be used as the canonical work orchestration system
        for Exponential development.

        Subgoals (in dependency order):
        1. planspec-schema-and-conventions-v0 - Establish schema conventions
        2. planspec-fixtures-and-integration-tests - Test infrastructure
        3. planspec-goal-to-plan-resolution-mvp - Plan selection logic
        4. planspec-status-and-observability-v0 - Status updates and visibility
  priority: 1000
